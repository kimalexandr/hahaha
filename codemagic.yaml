# iOS → TestFlight через Codemagic.
# Перед сборкой: в developer.apple.com должен быть App ID com.eventus.app (или создастся через API с --create).
# В App Store Connect должно быть приложение с этим Bundle ID. API Key — роль App Manager или Admin.
# Firebase: добавь iOS-приложение с bundle com.eventus.app и положи GoogleService-Info.plist в переменную IOS_GOOGLE_SERVICES.

workflows:
  ios-release:
    name: iOS IPA (release)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Имя должно совпадать с интеграцией в Codemagic (Integrations → Developer integrations).
      app_store_connect: app_store_connect_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eventus.app
      vars:
        BUNDLE_ID: "com.eventus.app"
      flutter: 3.41.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: GoogleService-Info.plist (файловая переменная IOS_GOOGLE_SERVICES)
        script: |
          if [ -n "${IOS_GOOGLE_SERVICES:-}" ] && [ -f "$IOS_GOOGLE_SERVICES" ]; then
            cp "$IOS_GOOGLE_SERVICES" ios/Runner/GoogleService-Info.plist
            echo "Copied GoogleService-Info.plist from IOS_GOOGLE_SERVICES"
          else
            echo "IOS_GOOGLE_SERVICES not set — Firebase на iOS может не собраться"
          fi
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Use profiles in Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: |
          cd ios && pod install
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # Отправка в App Store Connect → TestFlight (нужны права у API Key: App Manager или Admin).
    # https://docs.codemagic.io/flutter-publishing/publishing-to-app-store/
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
