name: Flutter Android CI

# 🔐 ЭТОТ БЛОК РАЗРЕШАЕТ ПУШ В РЕПОЗИТОРИЙ
permissions:
  contents: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Используем токен с правами выше
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Совпадает с stable в логах CI; intl приходит из flutter_localizations этого SDK.
          flutter-version: '3.41.9'
          cache: true

      # Один и тот же debug.keystore на всех сборках CI → стабильный SHA для Firebase Google Sign-In.
      # Если кеш пропал — можно положить base64 keystore в secret ANDROID_CI_KEYSTORE_BASE64.
      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-${{ runner.os }}-eventa-v1

      - name: Ensure Android debug keystore exists
        env:
          ANDROID_CI_KEYSTORE_BASE64: ${{ secrets.ANDROID_CI_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            if [ -n "$ANDROID_CI_KEYSTORE_BASE64" ]; then
              echo "$ANDROID_CI_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
              echo "Restored CI keystore from ANDROID_CI_KEYSTORE_BASE64 secret"
            else
              echo "::warning::CI debug.keystore missing from cache — generating a NEW one."
              echo "::warning::Google Sign-In (код 10) сломается, пока новый SHA не добавят в Firebase."
              keytool -genkey -v -keystore ~/.android/debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      # Актуальный SHA CI (keystore от 28 Jul 2026). При смене keystore — обновить и Firebase.
      - name: Verify CI signing SHA matches Firebase
        env:
          EXPECTED_CI_SHA1: "EA:85:26:2D:C7:55:2C:C2:AD:8B:09:D7:AC:0F:52:1E:B9:FC:BA:C3"
        run: |
          ACTUAL="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android 2>/dev/null \
            | awk -F' ' '/SHA1:/{print $2; exit}')"
          echo "Expected SHA1: $EXPECTED_CI_SHA1"
          echo "Actual SHA1:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CI_SHA1" ]; then
            echo "::error::CI keystore SHA изменился. Добавьте Actual SHA1 в Firebase (Android app fingerprints),"
            echo "::error::скачайте google-services.json, закоммитьте и обновите EXPECTED_CI_SHA1 в android-ci.yml."
            exit 1
          fi

      - run: flutter pub get
      - run: dart analyze

      # 🔧 Авто-форматирование с коммитом (только на push)
      - name: Format code and auto-commit if changed
        if: github.event_name == 'push'
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: auto-format with dart format [skip ci]"
            git push
          fi

      - run: dart format --set-exit-if-changed .
      - run: flutter test

      # SHA ключа CI (gradlew в репо нет — он в android/.gitignore; используем тот же debug.keystore, что и flutter build).
      - name: Android signing fingerprints (for Firebase Google Sign-In)
        run: |
          STORE="$HOME/.android/debug.keystore"
          {
            echo "CI signing key (debug.keystore, used for release APK in this project)"
            echo "Store: $STORE"
            echo "Alias: androiddebugkey"
            keytool -list -v -keystore "$STORE" -alias androiddebugkey \
              -storepass android -keypass android
          } 2>&1 | tee signing-report-ci.log

      - name: Firebase SHA (job summary)
        run: |
          {
            echo "## SHA для Firebase (APK с GitHub Actions)"
            echo "Проект: **eventus-f450f**, package: **com.eventus.app**"
            echo ""
            echo "Для APK из Actions нужен SHA (должен совпадать с Firebase):"
            echo ""
            grep -E 'SHA1:|SHA256:' signing-report-ci.log | head -10 || true
            echo ""
            echo "Если SHA сменился: Firebase → Add fingerprint → новый google-services.json → commit → rebuild."
            echo "Чтобы keystore не терялся: secret \`ANDROID_CI_KEYSTORE_BASE64\` (base64 от ~/.android/debug.keystore)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signing report
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-report
          path: signing-report-ci.log

      - name: Build APK & App Bundle
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/*.aab

      # Артефакты в облако (push): нужен JSON ключа SA — GOOGLE_DRIVE_SERVICE_ACCOUNT (или …_B64).
      # Рекомендуется GCS (без лимита «личного» Drive у SA):
      #   GCS_BUCKET_NAME — имя bucket (без gs://); в GCP включи Cloud Storage API, создай bucket,
      #   выдай SA из JSON роль Storage Object Creator на bucket.
      # Опционально Drive (часто 403 без Workspace Shared drive):
      #   GOOGLE_DRIVE_FOLDER_ID — ID папки; для обычного «Мой диск» у SA квоты нет — см. лог скрипта.
      - name: Upload release builds (GCS / Drive)
        if: github.event_name == 'push'
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 -m pip install --quiet \
            google-api-python-client google-auth-httplib2 google-auth google-cloud-storage
          python3 .github/scripts/upload_release_artifacts.py