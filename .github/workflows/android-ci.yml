name: Flutter Android CI

# 🔐 ЭТОТ БЛОК РАЗРЕШАЕТ ПУШ В РЕПОЗИТОРИЙ
permissions:
  contents: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Используем токен с правами выше
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Совпадает с stable в логах CI; intl приходит из flutter_localizations этого SDK.
          flutter-version: '3.41.9'
          cache: true

      - run: flutter pub get
      - run: dart analyze

      # 🔧 Авто-форматирование с коммитом (только на push)
      - name: Format code and auto-commit if changed
        if: github.event_name == 'push'
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: auto-format with dart format [skip ci]"
            git push
          fi

      - run: dart format --set-exit-if-changed .
      - run: flutter test

      - name: Build APK & App Bundle
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/*.aab

      # Нужны ОБА секрета (Settings → Secrets → Actions):
      #   GOOGLE_DRIVE_SERVICE_ACCOUNT — JSON ключа целиком ИЛИ GOOGLE_DRIVE_SERVICE_ACCOUNT_B64 (base64 от JSON).
      #   GOOGLE_DRIVE_FOLDER_ID — ID папки из URL Drive (.../folders/ID).
      # Папку расшарьте на client_email из JSON (поле client_email) с правом «Редактор».
      # В GCP включите API «Google Drive API» для проекта ключа.
      - name: Upload release builds to Google Drive
        if: github.event_name == 'push'
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 -m pip install --quiet google-api-python-client google-auth-httplib2 google-auth
          python3 .github/scripts/upload_to_google_drive.py